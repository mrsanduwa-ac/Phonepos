<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviXtech AI Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        h1, h2, h3, .title-font { font-family: 'Montserrat', sans-serif; }
        .navy-bg { background-color: #1e293b; }
        .loader { border: 3px solid #334155; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .canvas-container { max-width: 100%; aspect-ratio: 1 / 1; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col lg:flex-row gap-8 justify-center items-start min-h-screen">

    <!-- Controls Panel -->
    <div class="glass-panel p-6 rounded-2xl shadow-2xl w-full lg:w-1/3 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-[0_0_15px_rgba(37,99,235,0.5)]">A</div>
            <h2 class="text-2xl font-bold title-font">AviXtech Pro</h2>
        </div>
        
        <!-- Step 1: Upload Product -->
        <div class="mb-5 p-4 bg-slate-800/50 border border-slate-700 rounded-xl">
            <label class="block text-sm font-bold text-slate-300 mb-2">📦 1. භාණ්ඩයේ පින්තූරය:</label>
            <input type="file" id="productLoader" accept="image/*" class="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-sm focus:outline-none focus:border-blue-500 transition">
            
            <div id="aiExtractStatus" class="hidden mt-3 p-2 bg-blue-900/30 text-blue-300 rounded border border-blue-800/50 text-xs font-semibold flex items-center">
                <div class="loader"></div> AI මගින් දත්ත ලබාගනිමින්...
            </div>
        </div>

        <!-- Details Form -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-400 mb-1">මාතෘකාව (Title):</label>
            <input type="text" id="titleInput" class="w-full p-2.5 bg-slate-800 border border-slate-600 rounded-lg text-sm font-bold focus:border-blue-500 transition">
        </div>
        
        <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-400 mb-1">මිල (Price LKR):</label>
            <input type="text" id="priceInput" class="w-full p-2.5 bg-slate-800 border border-slate-600 rounded-lg text-sm font-bold focus:border-blue-500 transition">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-400 mb-1">විශේෂාංග (Features):</label>
            <textarea id="featuresInput" rows="3" class="w-full p-2.5 bg-slate-800 border border-slate-600 rounded-lg text-sm font-medium focus:border-blue-500 transition"></textarea>
        </div>

        <div class="mb-6 p-4 bg-purple-900/20 border border-purple-800/50 rounded-xl">
            <label class="block text-sm font-bold text-purple-300 mb-2">🎨 AI Image Prompt:</label>
            <textarea id="imagePromptInput" rows="4" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-300 focus:border-purple-500 transition"></textarea>
        </div>
        
        <button id="generateBtn" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold title-font rounded-xl text-lg transition shadow-[0_0_20px_rgba(79,70,229,0.3)] transform hover:-translate-y-1">
            ✨ Generate Pro Poster
        </button>

        <div id="aiGenStatus" class="hidden mt-4 text-center p-4 bg-slate-800/80 rounded-xl border border-slate-700">
            <div class="loader mb-2"></div>
            <p class="text-sm font-bold text-blue-300">AI Graphic Art නිර්මාණය කරමින්...</p>
            <p class="text-slate-400 text-xs mt-1">කරුණාකර රැඳී සිටින්න</p>
        </div>
        
        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-900/50 text-red-300 border border-red-800 rounded-lg text-sm text-center font-semibold"></div>
    </div>

    <!-- Output Panel -->
    <div class="w-full lg:w-1/2 flex flex-col items-center sticky top-8">
        <div class="canvas-container w-full max-w-lg bg-slate-900 rounded-2xl shadow-2xl overflow-hidden relative border border-slate-700 group">
            <canvas id="finalCanvas" width="1080" height="1080" class="w-full h-auto"></canvas>
            
            <button id="downloadBtn" class="hidden absolute bottom-6 right-6 bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-full shadow-[0_8px_30px_rgba(37,99,235,0.5)] transition transform hover:scale-110">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const REMOVE_BG_API_KEY = "8zR7vpyJ46GnSvBxzJw11saJ";

        let productBase64 = "";
        let productMimeType = "";
        let transparentImage = new Image();
        let aiGeneratedBg = new Image();
        let isProcessing = false;

        const canvas = document.getElementById('finalCanvas');
        const ctx = canvas.getContext('2d');
        
        // Initial Canvas Setup
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#64748b";
        ctx.font = "30px Inter";
        ctx.textAlign = "center";
        ctx.fillText("ප්‍රොෆෙෂනල් පෝස්ටරය මෙහි දිස්වේවි...", canvas.width/2, canvas.height/2);

        document.getElementById('productLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            productMimeType = file.type;
            const reader = new FileReader();
            reader.onload = function(event) {
                productBase64 = event.target.result.split(',')[1];
                extractDetailsWithAI();
            }
            reader.readAsDataURL(file);
        });

        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        // 1. Data Extraction & Prompt Generation
        async function extractDetailsWithAI() {
            if (!productBase64) return;
            document.getElementById('aiExtractStatus').classList.remove('hidden');

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const promptText = `Role: You are an Expert Product Marketer and AI Prompt Engineer.
            Task: Identify the product, extract specs, and write an image generation prompt.
            
            Background Rule for the Prompt: A clean, premium lifestyle background. Must include white/light-grey marble or matte concrete surfaces, soft warm sunlight, and blurred green indoor plants in the background. Bright, elegant, minimalist.

            Output STRICTLY as JSON: 
            {"productName": "string", "price": "number string", "features": ["string", "string"], "imagePrompt": "string"}`;

            const requestBody = {
                contents: [{ role: "user", parts: [{ text: promptText }, { inlineData: { mimeType: productMimeType, data: productBase64 } }] }],
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                const response = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
                const data = await response.json();
                let aiResultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (aiResultText) {
                    const aiData = JSON.parse(aiResultText.replace(/```json/gi, '').replace(/```/g, '').trim());
                    document.getElementById('titleInput').value = aiData.productName || "";
                    document.getElementById('priceInput').value = aiData.price ? aiData.price.replace(/[^0-9.]/g, '') : ""; 
                    document.getElementById('featuresInput').value = (aiData.features || []).join('\n');
                    document.getElementById('imagePromptInput').value = aiData.imagePrompt || "Product placed on a clean white and grey marble pedestal. Soft warm sunlight and blurred subtle green indoor plants in background. Professional product photography, highly detailed, empty space on left.";
                }
            } catch (error) { console.error(error); } 
            finally { document.getElementById('aiExtractStatus').classList.add('hidden'); }
        }

        // 2. Generate Background AND Remove Background simultaneously
        document.getElementById('generateBtn').addEventListener('click', async function() {
            if (!productBase64 || isProcessing) return;
            
            isProcessing = true;
            this.disabled = true;
            hideError();
            document.getElementById('aiGenStatus').classList.remove('hidden');
            document.getElementById('downloadBtn').classList.add('hidden');

            try {
                // Run Background Gen and Remove.bg in parallel for speed
                const [bgResult, removeBgResult] = await Promise.all([
                    generateBackground(),
                    removeProductBackground()
                ]);

                if (bgResult && removeBgResult) {
                    drawFinalComposite();
                    document.getElementById('downloadBtn').classList.remove('hidden');
                } else {
                    showError("නිර්මාණය අසාර්ථක විය.");
                }
            } catch (error) {
                console.error(error);
                showError("තාක්ෂණික දෝෂයකි. නැවත උත්සාහ කරන්න.");
            } finally {
                document.getElementById('aiGenStatus').classList.add('hidden');
                this.disabled = false;
                isProcessing = false;
            }
        });

        async function generateBackground() {
            const prompt = document.getElementById('imagePromptInput').value;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            const fullPrompt = `An empty professional photography scene. ${prompt}. No objects in the foreground, only the pedestal/surface. Leave the left side empty for text.`;

            try {
                const response = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instances: { prompt: fullPrompt }, parameters: { sampleCount: 1 } })
                });
                const data = await response.json();
                if (data.predictions && data.predictions[0]) {
                    return new Promise((resolve) => {
                        aiGeneratedBg.onload = () => resolve(true);
                        aiGeneratedBg.src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    });
                }
            } catch (e) { console.error(e); return false; }
            return false;
        }

        async function removeProductBackground() {
            try {
                const byteCharacters = atob(productBase64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) { byteNumbers[i] = byteCharacters.charCodeAt(i); }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: productMimeType });

                const formData = new FormData();
                formData.append('size', 'auto');
                formData.append('image_file', blob);

                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST', headers: { 'X-Api-Key': REMOVE_BG_API_KEY }, body: formData
                });

                if (response.ok) {
                    const resBlob = await response.blob();
                    return new Promise((resolve) => {
                        transparentImage.onload = () => resolve(true);
                        transparentImage.src = URL.createObjectURL(resBlob);
                    });
                }
            } catch (e) { console.error(e); return false; }
            return false;
        }

        // 3. Pro Typography & Blending Composition
        function drawFinalComposite() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw AI Generated Background
            const bgScale = Math.max(canvas.width / aiGeneratedBg.width, canvas.height / aiGeneratedBg.height);
            ctx.drawImage(aiGeneratedBg, (canvas.width - aiGeneratedBg.width * bgScale)/2, (canvas.height - aiGeneratedBg.height * bgScale)/2, aiGeneratedBg.width * bgScale, aiGeneratedBg.height * bgScale);

            // 2. The Text Backdrop (Frosted/Gradient) to make text readable
            const gradient = ctx.createLinearGradient(0, 0, canvas.width * 0.6, 0);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. Draw Product with Realistic Contact Shadow
            const pScale = Math.min(canvas.width / transparentImage.width, canvas.height / transparentImage.height) * 0.7; // Make it fit nicely
            const pWidth = transparentImage.width * pScale;
            const pHeight = transparentImage.height * pScale;
            // Position on the right side
            const px = canvas.width - pWidth - 50; 
            const py = (canvas.height - pHeight) / 2 + 50;

            // Contact Shadow (Underneath)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(px + pWidth/2, py + pHeight - 20, pWidth/2.2, 40, 0, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.filter = 'blur(15px)';
            ctx.fill();
            ctx.restore();

            // Ambient Shadow (Behind)
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 30;
            ctx.shadowOffsetX = -10;
            ctx.shadowOffsetY = 10;
            
            ctx.drawImage(transparentImage, px, py, pWidth, pHeight);
            
            // Reset Shadow for Text
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // 4. Pro Typography
            const title = document.getElementById('titleInput').value;
            const features = document.getElementById('featuresInput').value.split('\n');
            const priceVal = document.getElementById('priceInput').value;

            // Title
            ctx.textAlign = "left";
            ctx.fillStyle = "#0f172a"; // Very dark blue/slate
            ctx.font = "800 80px 'Montserrat'"; // Bold, modern font for title
            
            function wrapText(text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = ''; let currentY = y;
                for(let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                        ctx.fillText(line, x, currentY);
                        line = words[n] + ' ';
                        currentY += lineHeight;
                    } else { line = testLine; }
                }
                ctx.fillText(line, x, currentY);
                return currentY;
            }
            
            let nextY = wrapText(title, 80, 220, 550, 95) + 60;

            // Features
            ctx.font = "600 38px 'Inter'"; // Clean, readable font for specs
            for (let feature of features) {
                if (feature.trim() !== "") {
                    // Custom Icon (Diamond/Sparkle shape)
                    ctx.fillStyle = "#d97706"; // Amber/Gold accent
                    ctx.fillText("✦", 80, nextY);
                    
                    ctx.fillStyle = "#334155"; // Slate text
                    wrapText(feature.trim(), 130, nextY, 500, 50); // Wrap long features
                    nextY += 70;
                }
            }

            // Price Badge
            if (priceVal) {
                const priceText = "Rs. " + Number(priceVal).toLocaleString();
                ctx.font = "800 60px 'Montserrat'";
                const textWidth = ctx.measureText(priceText).width;
                
                // Modern Badge Layout
                nextY += 20; // Some spacing
                ctx.fillStyle = "#0f172a"; 
                ctx.beginPath();
                ctx.roundRect(80, nextY, textWidth + 70, 100, [15, 15, 15, 15]);
                ctx.fill();

                ctx.fillStyle = "#ffffff"; 
                ctx.fillText(priceText, 115, nextY + 72); 
            }
        }

        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (!aiGeneratedBg.src || !transparentImage.src) return;
            const link = document.createElement('a');
            link.download = `AviXtech-Pro-Design.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() { document.getElementById('errorMessage').classList.add('hidden'); }
    </script>
</body>
</html>
